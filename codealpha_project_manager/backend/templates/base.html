<!DOCTYPE html>
<html>
  <head>
    <title>Project Manager</title>

    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #0f0f0f;
        color: #fff;
      }

      .page {
        animation: fadeSlide 0.4s ease;
      }

      @keyframes fadeSlide {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      input {
        padding: 12px;
        width: 100%;
        margin-bottom: 12px;
        border: none;
        outline: none;
        font-size: 14px;
        background: #1a1a1a;
        color: white;
        border-radius: 6px;
      }

      input:focus {
        transform: scale(1.02);
        transition: 0.2s;
      }

      button {
        padding: 12px;
        width: 100%;
        border: none;
        cursor: pointer;
        background: white;
        color: black;
        font-weight: 600;
        border-radius: 6px;
        transition: 0.2s;
      }

      button:hover {
        transform: translateY(-2px);
      }

      button:active {
        transform: scale(0.97);
      }
    </style>
  </head>
  <body>
    <div class="page">{% block content %}{% endblock %}</div>
  </body>
</html>
