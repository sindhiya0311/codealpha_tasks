<!DOCTYPE html>
<html>
  <head>
    <title>Edit Profile • Nexa</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a href="/profile/{{ request.user.username }}/">←</a>
      <h3>Edit Profile</h3>
    </header>

    <div class="app">
      <form method="POST" class="post-form">
        {% csrf_token %}
        <input name="username" value="{{ request.user.username }}" />
        <textarea name="bio">{{ profile.bio }}</textarea>
        <button type="submit">Save</button>
      </form>
    </div>
  </body>
</html>
